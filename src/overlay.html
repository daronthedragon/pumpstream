<!doctype html>
<meta charset="utf-8" />
<title>pumpstream overlay</title>
<!--
  OBS browser source. Add http://localhost:8787/overlay at your canvas size.

  The page NEVER paints a background — not in any theme, not in any preset.
  OBS composites it straight over your scene. See the `transparent` rule below.

  Every knob is a query parameter; see README, or /overlay/config for a live
  builder. Booleans accept 1/0, true/false, yes/no, on/off.
-->
<style>
  /* ── tokens: every one of these is driven by a query parameter ──────────*/
  :root {
    --font: 20px;
    --accent: #7ee787;
    --text: #ffffff;
    --bubble-rgb: 0, 0, 0;
    --bubble-a: 0.55;
    --radius: 14px;
    --gap: 10px;
    --pad: 16px;
    --maxw: 92%;
    --bar: 3px;
  }

  /* Light surfaces change the BUBBLE, never the page. */
  body.theme-light {
    --bubble-rgb: 255, 255, 255;
    --text: #10151b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    /* ── THE transparency rule ───────────────────────────────────────────
       Nothing may ever paint here. OBS relies on the page compositing to
       zero alpha; a themed background would show as an opaque slab on
       stream. Tests assert this stays transparent under every preset. */
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: var(--font);
    color: var(--text);
  }

  #feed {
    position: absolute;
    inset: 0;
    padding: var(--pad);
    display: flex;
    flex-direction: column;
    /* Column flex stretches by default, which pads every pill out to the
       full source width. Hug the content instead. */
    align-items: flex-start;
    justify-content: flex-end;
    gap: var(--gap);
  }
  body.align-right #feed { align-items: flex-end; }
  body.align-center #feed { align-items: center; }
  body.grow-top #feed { justify-content: flex-start; }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: var(--maxw);
    padding: 10px 14px;
    border-radius: var(--radius);
    background: rgba(var(--bubble-rgb), var(--bubble-a));
    border-left: var(--bar) solid var(--accent);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(3px);
    animation: enter 320ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  body.align-right .msg {
    flex-direction: row-reverse;
    border-left: none;
    border-right: var(--bar) solid var(--accent);
  }

  /* ── toggles ───────────────────────────────────────────────────────────*/
  body.no-bar .msg { border-left: none; border-right: none; }
  body.no-shadow .msg { text-shadow: none; }
  body.no-blur .msg { backdrop-filter: none; }
  body.no-anim .msg, body.no-anim .msg.leaving { animation: none; }
  body.no-bubble .msg { background: none; padding: 0; backdrop-filter: none; }
  /* With no bubble there is nothing behind the text, so the shadow is the
     only thing keeping it readable over bright gameplay. */
  body.no-bubble:not(.no-shadow) .msg {
    text-shadow: 0 1px 4px #000, 0 0 10px rgba(0, 0, 0, 0.85);
  }

  .msg.leaving { animation: leave 600ms ease forwards; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes leave {
    to { opacity: 0; transform: translateY(-8px); max-height: 0; padding-block: 0; margin-top: calc(var(--gap) * -1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg, .msg.leaving { animation: none; }
  }

  .avatar {
    width: 1.9em; height: 1.9em;
    border-radius: 50%;
    flex: 0 0 auto;
    object-fit: cover;
    background: rgba(128, 128, 128, 0.25);
  }

  .body { min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  body.align-right .head { justify-content: flex-end; }

  .name { font-weight: 700; color: var(--accent); }

  .bal, .tag, .time {
    font-size: 0.72em;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .bal { background: rgba(128, 128, 128, 0.28); }
  .rank {
    background: rgba(128, 128, 128, 0.28);
    font-variant-numeric: tabular-nums;
  }
  /* The top three are the ones worth looking at. */
  .rank.top { background: #f5c451; color: #2b1d00; }
  .time { background: none; padding: 2px 0; opacity: 0.6; }
  .tag {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--accent);
    color: #06240f;
  }

  .text { line-height: 1.35; overflow-wrap: anywhere; }

  /* ── buy / sell alerts ─────────────────────────────────────────────────
     Same feed, deliberately different shape so a glance tells them apart
     from chat. Colour is not the only signal — the arrow and label carry it
     too, so this still reads for a colour-blind viewer. */
  .alert {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-weight: 700;
    border-left-color: #3fb950;
  }
  body.align-right .alert { border-right-color: #3fb950; }
  .alert.sell { border-left-color: #f85149; }
  body.align-right .alert.sell { border-right-color: #f85149; }
  .alert .arrow { font-size: 1.1em; color: #3fb950; }
  .alert.sell .arrow { color: #f85149; }
  .alert .amount { color: #3fb950; font-variant-numeric: tabular-nums; }
  .alert.sell .amount { color: #f85149; }
  .alert .who { opacity: 0.85; font-weight: 600; }
  .alert .label {
    font-size: 0.68em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(128, 128, 128, 0.3);
  }

  .reply {
    font-size: 0.78em;
    opacity: 0.65;
    border-left: 2px solid currentColor;
    padding-left: 7px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 30ch;
  }

  /* ── preview backdrop ──────────────────────────────────────────────────
     `?demo=` paints a stand-in for gameplay so the overlay can be judged in
     an ordinary browser. It is a REAL ELEMENT behind the feed — never a
     background on html or body, which must stay transparent for OBS. An
     iframe canvas is opaque in CEF, so the builder cannot show a backdrop
     through the frame; this is how it gets one. */
  #demo {
    position: absolute;
    inset: 0;
    z-index: -1;
  }
  #demo.grid {
    background-color: #1b2027;
    background-image:
      linear-gradient(45deg, #2a2f37 25%, transparent 25%),
      linear-gradient(-45deg, #2a2f37 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2f37 75%),
      linear-gradient(-45deg, transparent 75%, #2a2f37 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  #demo.scene { background: linear-gradient(135deg, #1e5a8a, #7a3ea8 50%, #b8562f); }

  /* Small on purpose: the streamer should notice, the audience should not. */
  #status {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    background: rgba(190, 40, 40, 0.9);
    color: #fff;
    display: none;
  }
  #status.show { display: block; }
</style>

<div id="feed"></div>
<div id="status"></div>

<script>
  const q = new URLSearchParams(location.search);

  /* ── option parsing: validated, never trusted straight into CSS ────────*/
  const TRUE = ['1', 'true', 'yes', 'on'];
  const FALSE = ['0', 'false', 'no', 'off'];

  function bool(key, dflt) {
    const v = q.get(key);
    if (v === null) return dflt;
    if (TRUE.includes(v.toLowerCase())) return true;
    if (FALSE.includes(v.toLowerCase())) return false;
    return dflt;
  }
  function num(key, dflt, min, max) {
    const v = Number(q.get(key));
    if (q.get(key) === null || !Number.isFinite(v)) return dflt;
    return Math.min(Math.max(v, min), max);
  }
  function pick(key, allowed, dflt) {
    const v = (q.get(key) || '').toLowerCase();
    return allowed.includes(v) ? v : dflt;
  }
  // Colours land in a CSS custom property, so anything that is not plainly a
  // hex colour is rejected rather than injected.
  function colour(key, dflt) {
    const v = q.get(key);
    if (!v) return dflt;
    const hex = v.startsWith('#') ? v : '#' + v;
    return /^#([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(hex) ? hex : dflt;
  }

  /* Presets set defaults; any explicit parameter still wins. */
  const PRESETS = {
    dark:    {},
    light:   { theme: 'light' },
    minimal: { bubble: 0, bar: 0, avatars: false, blur: false },
    solid:   { bubble: 1, blur: false },
    ghost:   { bubble: 0, bar: 0, blur: false },
  };
  const preset = PRESETS[pick('preset', Object.keys(PRESETS), 'dark')] ?? {};
  const d = (key, fallback) => (key in preset ? preset[key] : fallback);

  const opt = {
    // layout
    max: num('max', 8, 1, 100),
    fade: num('fade', 0, 0, 3600),
    font: num('font', 20, 8, 96),
    align: pick('align', ['left', 'right', 'center'], 'left'),
    grow: pick('grow', ['up', 'down'], 'up'),
    gap: num('gap', 10, 0, 80),
    pad: num('pad', 16, 0, 200),
    width: num('width', 92, 10, 100),
    radius: num('radius', 14, 0, 60),

    // surface
    theme: pick('theme', ['dark', 'light'], d('theme', 'dark')),
    accent: colour('accent', '#7ee787'),
    text: colour('text', null),
    bubble: num('bubble', d('bubble', 0.55), 0, 1),
    bar: num('bar', d('bar', 3), 0, 12),
    shadow: bool('shadow', d('shadow', true)),
    blur: bool('blur', d('blur', true)),
    anim: bool('anim', d('anim', true)),

    // content
    avatars: bool('avatars', d('avatars', true)),
    balance: bool('balance', true),
    share: bool('share', false),
    rank: bool('rank', true),
    ranktop: num('ranktop', 100, 1, 100000),
    names: bool('names', true),
    replies: bool('replies', true),
    badges: bool('badges', true),
    time: bool('time', false),

    // filtering (client side, so one server can feed differently-tuned sources)
    holders: bool('holders', false),
    minbal: num('minbal', 0, 0, Number.MAX_SAFE_INTEGER),
    censor: pick('censor', ['off', 'mask', 'drop'], q.get('censor') === '1' ? 'mask' : 'off'),
    block: (q.get('block') || '').split(',').map((w) => w.trim()).filter(Boolean),

    // plumbing
    alerts: bool('alerts', false),
    alertmin: num('alertmin', 0, 0, Number.MAX_SAFE_INTEGER),
    status: bool('status', true),
    mint: q.get('mint') || '',
    replay: num('replay', 10, 0, 200),
  };

  const root = document.documentElement.style;
  root.setProperty('--font', opt.font + 'px');
  root.setProperty('--accent', opt.accent);
  root.setProperty('--gap', opt.gap + 'px');
  root.setProperty('--pad', opt.pad + 'px');
  root.setProperty('--maxw', opt.width + '%');
  root.setProperty('--radius', opt.radius + 'px');
  root.setProperty('--bubble-a', String(opt.bubble));
  root.setProperty('--bar', opt.bar + 'px');
  if (opt.text) root.setProperty('--text', opt.text);

  const body = document.body;
  body.classList.toggle('theme-light', opt.theme === 'light');
  body.classList.toggle('align-right', opt.align === 'right');
  body.classList.toggle('align-center', opt.align === 'center');
  body.classList.toggle('grow-top', opt.grow === 'down');
  body.classList.toggle('no-bar', opt.bar === 0);
  body.classList.toggle('no-shadow', !opt.shadow);
  body.classList.toggle('no-blur', !opt.blur);
  body.classList.toggle('no-anim', !opt.anim);
  body.classList.toggle('no-bubble', opt.bubble === 0);

  const feed = document.getElementById('feed');
  const statusEl = document.getElementById('status');

  // Preview-only backdrop. Never reachable unless explicitly asked for, and
  // it paints its own element so html/body stay transparent for OBS.
  const demo = pick('demo', ['grid', 'scene'], '');
  if (demo) {
    const el = document.createElement('div');
    el.id = 'demo';
    el.className = demo;
    document.body.prepend(el);
  }

  function setStatus(text) {
    if (!opt.status) return;
    statusEl.textContent = text || '';
    statusEl.classList.toggle('show', Boolean(text));
  }

  function remove(el) {
    if (!el.isConnected || el.classList.contains('leaving')) return;
    el.classList.add('leaving');
    el.addEventListener('animationend', () => el.remove(), { once: true });
    // If the animation never fires (throttled tab, anim disabled), still go.
    setTimeout(() => el.remove(), opt.anim ? 900 : 0);
  }

  /* ── word filter ───────────────────────────────────────────────────────
     Off by default: silently rewriting someone's chat should always be a
     deliberate choice. `censor=mask` stars the word out, `censor=drop` hides
     the whole comment, and `block=` adds your own terms.

     This is a blunt word list, not moderation. It will miss things, and a
     determined person routes around it in seconds. */
  const PROFANITY = [
    'fuck', 'shit', 'bitch', 'cunt', 'whore', 'slut', 'faggot', 'nigger',
    'nigga', 'retard', 'rape', 'dick', 'cock', 'pussy', 'bastard', 'wanker',
  ];

  const words = [...PROFANITY, ...opt.block].map((w) =>
    w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
  );
  // Trailing \w* catches the usual suffixes (fucking, shitty) without also
  // eating innocent words that merely contain the stem.
  const BLOCKED = words.length ? new RegExp(`\\b(${words.join('|')})\\w*\\b`, 'gi') : null;

  function screen(text) {
    if (!BLOCKED || opt.censor === 'off') return text;
    BLOCKED.lastIndex = 0;
    if (!BLOCKED.test(text)) return text;
    if (opt.censor === 'drop') return null;
    BLOCKED.lastIndex = 0;
    return text.replace(BLOCKED, (m) => m[0] + '*'.repeat(Math.max(m.length - 1, 1)));
  }

  function format(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  }

  function add(c) {
    // Client-side gating, independent of how the server was started.
    if (opt.holders && !c.holder) return;
    if (opt.minbal > 0 && !(c.balance >= opt.minbal)) return;

    const screened = screen(c.text);
    if (screened === null) return; // censor=drop

    const el = document.createElement('div');
    el.className = 'msg';

    if (opt.avatars && c.avatar) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = c.avatar;
      img.alt = '';
      img.onerror = () => img.remove();
      el.append(img);
    }

    const bodyEl = document.createElement('div');
    bodyEl.className = 'body';

    if (opt.replies && c.replyTo?.preview) {
      const r = document.createElement('div');
      r.className = 'reply';
      r.textContent = '↳ ' + c.replyTo.preview;
      bodyEl.append(r);
    }

    const head = document.createElement('div');
    head.className = 'head';

    if (opt.names) {
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = c.username || (c.author ? c.author.slice(0, 6) : 'anon');
      head.append(name);
    }
    if (opt.badges && (c.isCreator || c.isModerator)) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = c.isCreator ? 'dev' : 'mod';
      head.append(tag);
    }
    // Rank only exists when the roster is available, and only the sharp end
    // of it is interesting — #1841 is noise, #3 is a talking point.
    if (opt.rank && c.rank > 0 && c.rank <= opt.ranktop) {
      const r = document.createElement('span');
      r.className = c.rank <= 3 ? 'rank top' : 'rank';
      r.textContent = '#' + c.rank;
      head.append(r);
    }
    if (opt.balance && c.balance > 0) {
      const bal = document.createElement('span');
      bal.className = 'bal';
      bal.textContent = format(c.balance);
      head.append(bal);
    }
    if (opt.share && c.share > 0) {
      const sh = document.createElement('span');
      sh.className = 'bal';
      // Sub-0.01% rounds to nothing useful, so give small holders a floor.
      sh.textContent = c.share >= 0.0001 ? (c.share * 100).toFixed(2) + '%' : '<0.01%';
      head.append(sh);
    }
    if (opt.time && c.timestamp) {
      const t = document.createElement('span');
      t.className = 'time';
      const dt = new Date(c.timestamp);
      t.textContent = Number.isNaN(dt.getTime())
        ? ''
        : `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
      head.append(t);
    }

    const text = document.createElement('div');
    text.className = 'text';
    // textContent, never innerHTML — chat is untrusted and this is on stream.
    text.textContent = screened;

    if (head.childElementCount) bodyEl.append(head);
    bodyEl.append(text);
    el.append(bodyEl);
    place(el);
  }

  /** A buy or sell, rendered in the same feed as chat. */
  function addAlert(c) {
    if (!opt.alerts) return;
    if (Math.abs(c.delta) < opt.alertmin) return;

    const el = document.createElement('div');
    el.className = 'msg alert' + (c.type === 'sell' ? ' sell' : '');

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = c.type === 'sell' ? '▼' : '▲';

    const amount = document.createElement('span');
    amount.className = 'amount';
    amount.textContent = (c.delta > 0 ? '+' : '−') + format(Math.abs(c.delta));

    const who = document.createElement('span');
    who.className = 'who';
    // No username on chain — the wallet is all we have.
    who.textContent = c.owner ? c.owner.slice(0, 4) + '…' + c.owner.slice(-4) : '';

    el.append(arrow, amount, who);

    if (c.first || c.exit) {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = c.first ? 'new holder' : 'exit';
      el.append(label);
    } else if (opt.rank && c.rank > 0 && c.rank <= opt.ranktop) {
      const r = document.createElement('span');
      r.className = c.rank <= 3 ? 'rank top' : 'rank';
      r.textContent = '#' + c.rank;
      el.append(r);
    }

    place(el);
  }

  /** Shared tail: append, trim to max, schedule the fade. */
  function place(el) {
    feed.append(el);
    const live = [...feed.children].filter((m) => !m.classList.contains('leaving'));
    while (live.length > opt.max) remove(live.shift());
    if (opt.fade > 0) setTimeout(() => remove(el), opt.fade * 1000);
  }

  let backoff = 1000;

  function connect() {
    const params = new URLSearchParams();
    if (opt.mint) params.set('mint', opt.mint);
    params.set('replay', String(opt.replay));
    const ws = new WebSocket(`ws://${location.host}?${params}`);

    ws.onopen = () => { backoff = 1000; setStatus(''); };

    ws.onmessage = (ev) => {
      const { type, data } = JSON.parse(ev.data);
      if (type === 'comment') return add(data);
      if (type === 'holderChange') return addAlert(data);
      // A broken feed must never just look like a quiet chat.
      if (type === 'drift') return setStatus('pumpstream: upstream changed');
      if (type === 'degraded') return setStatus('pumpstream: holder checks failing');
    };

    // OBS suspends and reloads browser sources constantly; always come back.
    ws.onclose = () => {
      setStatus('pumpstream: disconnected');
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 15000);
    };
    ws.onerror = () => ws.close();
  }

  connect();
  window.__pumpstream = { opt }; // for the config builder and tests
</script>
