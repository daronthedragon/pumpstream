<!doctype html>
<meta charset="utf-8" />
<title>pumpstream overlay</title>
<!--
  OBS browser source. Add http://localhost:8787/overlay at your canvas size.
  Background is transparent on purpose — OBS composites it over your scene.

  Query options (all optional):
    ?mint=<mint>     only show one token when the server follows several
    &max=8           how many comments stay on screen
    &fade=0          seconds before a comment fades out (0 = never)
    &font=20         base font size in px
    &align=left      left | right
    &avatars=1       show profile pictures
    &balance=1       show the holder's balance badge
    &replies=1       show the quoted parent of a reply
    &status=1        show a corner badge when the feed is broken
    &accent=#7ee787  highlight colour
-->
<style>
  :root {
    --font: 20px;
    --accent: #7ee787;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    /* OBS composites over this; never paint a background. */
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: var(--font);
    color: #fff;
  }

  #feed {
    position: absolute;
    inset: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;   /* newest at the bottom, like a chat */
    /* Without this, column flex stretches every pill to the full width and a
       two-word message gets the same slab as a long one. */
    align-items: flex-start;
    gap: 10px;
  }
  body.align-right #feed { align-items: flex-end; }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 92%;
    padding: 10px 14px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.55);
    border-left: 3px solid var(--accent);
    /* Legible over bright gameplay without a heavy plate. */
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(3px);
    animation: enter 320ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  body.align-right .msg {
    flex-direction: row-reverse;
    border-left: none;
    border-right: 3px solid var(--accent);
  }
  .msg.leaving { animation: leave 600ms ease forwards; }

  @keyframes enter {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes leave {
    to { opacity: 0; transform: translateY(-8px); max-height: 0; padding-block: 0; margin-top: -10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg, .msg.leaving { animation: none; }
  }

  .avatar {
    width: 1.9em; height: 1.9em;
    border-radius: 50%;
    flex: 0 0 auto;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.15);
  }

  .body { min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  body.align-right .head { justify-content: flex-end; }

  .name { font-weight: 700; color: var(--accent); }

  .bal {
    font-size: 0.72em;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    white-space: nowrap;
  }
  .tag {
    font-size: 0.68em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--accent);
    color: #06240f;
  }

  .text { line-height: 1.35; overflow-wrap: anywhere; }

  .reply {
    font-size: 0.78em;
    opacity: 0.65;
    border-left: 2px solid rgba(255, 255, 255, 0.3);
    padding-left: 7px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 30ch;
  }

  /* Small, deliberately unglamorous: the streamer should notice it, the
     audience should not. Only ever shown when the feed is actually broken. */
  #status {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    background: rgba(190, 40, 40, 0.9);
    color: #fff;
    display: none;
  }
  #status.show { display: block; }
</style>

<div id="feed"></div>
<div id="status"></div>

<script>
  const q = new URLSearchParams(location.search);
  const opt = {
    mint: q.get('mint') || '',
    max: Math.max(1, Number(q.get('max') ?? 8)),
    fade: Number(q.get('fade') ?? 0),
    font: Number(q.get('font') ?? 20),
    align: q.get('align') === 'right' ? 'right' : 'left',
    avatars: q.get('avatars') !== '0',
    balance: q.get('balance') !== '0',
    replies: q.get('replies') !== '0',
    status: q.get('status') !== '0',
    accent: q.get('accent') || '#7ee787',
  };

  document.documentElement.style.setProperty('--font', opt.font + 'px');
  document.documentElement.style.setProperty('--accent', opt.accent);
  document.body.classList.toggle('align-right', opt.align === 'right');

  const feed = document.getElementById('feed');
  const statusEl = document.getElementById('status');

  function setStatus(text) {
    if (!opt.status) return;
    statusEl.textContent = text || '';
    statusEl.classList.toggle('show', Boolean(text));
  }

  function remove(el) {
    if (!el.isConnected || el.classList.contains('leaving')) return;
    el.classList.add('leaving');
    el.addEventListener('animationend', () => el.remove(), { once: true });
    // Belt and braces: if the animation never fires (tab throttled), still go.
    setTimeout(() => el.remove(), 900);
  }

  function add(c) {
    const el = document.createElement('div');
    el.className = 'msg';

    if (opt.avatars && c.avatar) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = c.avatar;
      img.alt = '';
      img.onerror = () => img.remove();
      el.append(img);
    }

    const body = document.createElement('div');
    body.className = 'body';

    if (opt.replies && c.replyTo?.preview) {
      const r = document.createElement('div');
      r.className = 'reply';
      r.textContent = '↳ ' + c.replyTo.preview;
      body.append(r);
    }

    const head = document.createElement('div');
    head.className = 'head';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = c.username || (c.author ? c.author.slice(0, 6) : 'anon');
    head.append(name);

    if (c.isCreator) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'dev';
      head.append(tag);
    }

    if (opt.balance && c.balance > 0) {
      const bal = document.createElement('span');
      bal.className = 'bal';
      bal.textContent = format(c.balance);
      head.append(bal);
    }

    const text = document.createElement('div');
    text.className = 'text';
    // textContent, never innerHTML — chat is untrusted input.
    text.textContent = c.text;

    body.append(head, text);
    el.append(body);
    feed.append(el);

    // Count only messages that are NOT already animating out. `remove()`
    // detaches asynchronously, so counting every child means this loop can
    // never make progress — which locks up the whole browser source the
    // moment chat arrives faster than the exit animation.
    const live = [...feed.children].filter((m) => !m.classList.contains('leaving'));
    while (live.length > opt.max) remove(live.shift());

    if (opt.fade > 0) setTimeout(() => remove(el), opt.fade * 1000);
  }

  function format(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  }

  let backoff = 1000;

  function connect() {
    const url = `ws://${location.host}${opt.mint ? '?mint=' + encodeURIComponent(opt.mint) : ''}`;
    const ws = new WebSocket(url);

    ws.onopen = () => {
      backoff = 1000;
      setStatus('');
    };

    ws.onmessage = (ev) => {
      const { type, data } = JSON.parse(ev.data);
      if (type === 'comment') return add(data);
      // A broken feed must not look like a quiet chat.
      if (type === 'drift') return setStatus('pumpstream: upstream changed');
      if (type === 'degraded') return setStatus('pumpstream: holder checks failing');
    };

    // OBS sources get reloaded and suspended constantly; always come back.
    ws.onclose = () => {
      setStatus('pumpstream: disconnected');
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 15000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
